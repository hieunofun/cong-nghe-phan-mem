# Run through: node scripts/devops-demo.js up
# Application containers and their existing volumes stay in docker-compose.yml.
x-devops-logging: &devops-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  jenkins:
    build:
      context: ./devops/jenkins
    image: joblink-jenkins:1.0
    container_name: joblink-jenkins
    # The local lab uses the host Docker socket to deploy sibling containers.
    user: root
    restart: unless-stopped
    environment:
      JAVA_OPTS: -Xms128m -Xmx384m -Djenkins.install.runSetupWizard=false
      JENKINS_ADMIN_ID: admin
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Run node scripts/devops-demo.js up first}
      JOBLINK_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-trienkhaiphanmemcki}
      SONAR_HOST_URL: ${SONAR_HOST_URL:-http://sonarqube:9000}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins_data:/var/jenkins_home
      - .:/opt/joblink:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 60s
    mem_limit: 768m
    logging: *devops-logging
    networks:
      - joblink-network

  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    container_name: joblink-blackbox
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./devops/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9115/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 64m
    logging: *devops-logging
    networks:
      - joblink-network

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: joblink-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9100/metrics"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 64m
    logging: *devops-logging
    networks:
      - joblink-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: joblink-cadvisor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 128m
    logging: *devops-logging
    networks:
      - joblink-network

  sonarqube:
    image: sonarqube:lts-community
    container_name: joblink-sonarqube
    profiles: ["sonar"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/api/system/status"]
      interval: 15s
      timeout: 5s
      retries: 24
      start_period: 60s
    mem_limit: 2g
    logging: *devops-logging
    networks:
      - joblink-network

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: joblink-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./devops/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 64m
    logging: *devops-logging
    networks:
      - joblink-network

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: joblink-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=256MB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./devops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./devops/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      blackbox:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
      node-exporter:
        condition: service_healthy
      cadvisor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 18
    mem_limit: 256m
    logging: *devops-logging
    networks:
      - joblink-network

  grafana:
    image: grafana/grafana:13.3.0
    container_name: joblink-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run node scripts/devops-demo.js up first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/joblink-overview.json
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./devops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./devops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    mem_limit: 512m
    logging: *devops-logging
    networks:
      - joblink-network

volumes:
  jenkins_data:
    name: joblink_jenkins_data
  prometheus_data:
    name: joblink_prometheus_data
  grafana_data:
    name: joblink_grafana_data
  alertmanager_data:
    name: joblink_alertmanager_data
  sonarqube_data:
    name: joblink_sonarqube_data
  sonarqube_extensions:
    name: joblink_sonarqube_extensions
  sonarqube_logs:
    name: joblink_sonarqube_logs
