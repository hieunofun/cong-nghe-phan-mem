apiVersion: apps/v1
kind: Deployment
metadata:
  name: joblink-ai
  namespace: joblink
  labels:
    app: joblink-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: joblink-ai
  template:
    metadata:
      labels:
        app: joblink-ai
    spec:
      containers:
        - name: ai-service
          image: joblink-ai:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: AI_SERVICE_HOST
              value: "0.0.0.0"
            - name: AI_SERVICE_PORT
              value: "5000"
            - name: AI_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: joblink-secret
                  key: AI_SECRET_TOKEN
          ports:
            - containerPort: 5000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: joblink-ai
  namespace: joblink
  labels:
    app: joblink-ai
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: joblink-ai
