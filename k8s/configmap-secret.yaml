apiVersion: v1
kind: ConfigMap
metadata:
  name: joblink-config
  namespace: joblink
data:
  NODE_ENV: "production"
  PORT: "3000"
  DB_CLIENT: "mysql"
  DB_HOST: "joblink-mysql"
  DB_PORT: "3306"
  DB_NAME: "joblink_db"
  STORAGE_DRIVER: "local"
  AI_SERVICE_URL: "http://joblink-ai:5000"
  AI_TIMEOUT_MS: "15000"
---
apiVersion: v1
kind: Secret
metadata:
  name: joblink-secret
  namespace: joblink
type: Opaque
stringData:
  DB_USER: "joblink_user"
  DB_PASSWORD: "JobLink_Secret_Password_2026!"
  DB_ROOT_PASSWORD: "JobLink_Root_Secret_2026!"
  JWT_SECRET: "joblink-k8s-super-secure-jwt-secret-key-2026"
  SESSION_SECRET: "joblink-k8s-session-secret-production"
  AI_SECRET_TOKEN: "joblink-internal-ai-service-token-2026-production"
