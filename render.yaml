envVarGroups:
  - name: joblink-ai-shared
    envVars:
      - key: AI_SERVICE_TOKEN
        generateValue: true

services:
  - type: web
    name: joblink-ai
    runtime: python
    plan: free
    rootDir: ai_service
    buildCommand: pip install -r requirements.render.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 180
    healthCheckPath: /health
    envVars:
      - fromGroup: joblink-ai-shared
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DB_CLIENT
        value: postgres
      - key: AI_LIGHTWEIGHT_MODE
        value: 'true'
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b

  - type: web
    name: joblink-frontend
    runtime: static
    buildCommand: npm ci && npm run build:frontend
    staticPublishPath: ./public
    envVars:
      - key: FRONTEND_API_BASE_URL
        sync: false
