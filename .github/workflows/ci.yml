name: CI & DevSecOps Verification

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'release/**']
  pull_request:

jobs:
  test-and-audit:
    name: Unit Tests & Security Audit (Node 22 + Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node test suite
        run: npm test

      - name: Run npm security audit
        run: npm audit --audit-level=high

      - name: Setup Python 3.11 for AI service
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai_service/requirements.render.txt

      - name: Install AI lightweight dependencies
        run: pip install -r ai_service/requirements.render.txt pymysql

      - name: Run Python AI multilingual matching tests
        env:
          AI_LIGHTWEIGHT_MODE: 'true'
        run: python -m unittest ai_service.test_multilingual_matching

  docker-and-monitoring-verify:
    name: Container Hardening & Prometheus Rules Verification
    runs-on: ubuntu-latest
    needs: test-and-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose manifests
        run: |
          docker compose -f docker-compose.yml config -q
          JENKINS_ADMIN_PASSWORD=ci_placeholder GRAFANA_ADMIN_PASSWORD=ci_placeholder \
            docker compose -f docker-compose.yml -f docker-compose.devops.yml config -q

      - name: Build production Web, AI, and Gateway images
        run: docker compose -f docker-compose.yml build web ai gateway

      - name: Verify non-root container users and isolated AI tests
        run: |
          WEB_UID=$(docker run --rm --network none --entrypoint id joblink-web:1.0 -u)
          AI_UID=$(docker run --rm --network none --entrypoint id joblink-ai:1.0 -u)
          echo "Container UIDs -> web=$WEB_UID, ai=$AI_UID"
          test "$WEB_UID" != "0"
          test "$AI_UID" != "0"
          docker run --rm --network none joblink-ai:1.0 python -m unittest ai_service.test_multilingual_matching

      - name: Validate Prometheus config and unit-test alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/devops/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.15.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/devops/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.15.1 test rules /etc/prometheus/alerts.test.yml
