<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — JobLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="/index.html" class="brand"><span class="brand-mark">JL</span>JobLink</a>
    <nav class="nav-links">
      <a href="/index.html">Trang chủ</a>
      <a href="/jobs.html">Việc làm</a>
      <a href="/register.html">Dành cho Doanh nghiệp</a>
    </nav>
    <div class="nav-actions">
      <div id="nav-auth-slot" class="flex gap-12 items-center"></div>
      <button class="nav-toggle" aria-label="Mở menu">☰</button>
    </div>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <h2 style="margin-bottom:6px;">Đăng nhập</h2>
    <p style="margin-bottom:24px;">Chưa có tài khoản? <a href="/register.html">Đăng ký ngay</a></p>

    <div id="alert-slot"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="input" required placeholder="ban@email.com">
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" class="input" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Đăng nhập</button>
    </form>
    <div id="social-login-container"></div>

    <p class="form-hint" style="text-align:center; margin-top:18px;">
      Tài khoản demo — Admin: admin@joblink.vn / Admin@123
    </p>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/header.js"></script>
<script src="/js/social-login.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/chatbot-widget.js"></script>
<script>
// Hien thi nut social login
renderSocialButtons('social-login-container');

// Hien thi loi neu OAuth that bai
const urlErr = new URLSearchParams(window.location.search).get('error');
if (urlErr === 'oauth_failed') {
  const slot = document.getElementById('alert-slot');
  if (slot) slot.innerHTML = '<div class="alert alert-error">Đăng nhập bằng mạng xã hội không thành công. Vui lòng thử lại.</div>';
}
</script>
</body>
</html>
