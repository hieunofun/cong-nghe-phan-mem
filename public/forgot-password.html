<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quên mật khẩu — JobLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
<header class="auth-header">
  <a href="/index.html" class="brand"><span class="brand-mark">JL</span>JobLink</a>
  <a href="/login.html" class="auth-header-link">Quay lại đăng nhập</a>
</header>
<main class="auth-shell auth-shell-single">
  <section class="auth-form-panel auth-single-panel" aria-labelledby="forgot-title">
    <a href="/login.html" class="back-link">← Đăng nhập</a>
    <div class="auth-form-head">
      <p class="auth-kicker">Khôi phục tài khoản</p>
      <h1 id="forgot-title">Quên mật khẩu?</h1>
      <p>Nhập email đã đăng ký. Liên kết đặt lại mật khẩu có hiệu lực trong 30 phút.</p>
    </div>
    <div id="alert-slot" aria-live="polite"></div>
    <form id="forgot-form" novalidate>
      <div class="form-group">
        <label for="email">Địa chỉ email</label>
        <input type="email" id="email" class="input" required autocomplete="email" inputmode="email" placeholder="tenban@email.com">
      </div>
      <button type="submit" class="btn btn-primary btn-block auth-submit" id="submit-btn">Gửi hướng dẫn</button>
    </form>
    <div class="dev-reset-box" id="dev-reset-link" hidden>
      <strong>Chế độ demo</strong>
      <p>Máy chủ email chưa được cấu hình. Dùng liên kết bên dưới để tiếp tục kiểm thử.</p>
      <a class="btn btn-outline btn-block" href="#">Mở trang đặt lại mật khẩu</a>
    </div>
  </section>
</main>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
