<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt lại mật khẩu — JobLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
<main class="auth-shell auth-shell-single">
  <section class="auth-single-panel" aria-labelledby="reset-title">
    <a href="/login.html" class="back-link" data-history-back data-fallback="/login.html"><span aria-hidden="true">&larr;</span> Quay lại</a>

    <div class="auth-form-head">
      <p class="auth-kicker">Bảo mật tài khoản</p>
      <h1 id="reset-title">Đặt mật khẩu mới</h1>
      <p>Mật khẩu mới cần có ít nhất 8 ký tự, gồm chữ hoa, chữ thường và chữ số.</p>
    </div>

    <div id="alert-slot" aria-live="polite"></div>

    <form id="reset-form" novalidate>
      <div class="form-group">
        <label for="password">Mật khẩu mới</label>
        <div class="password-field">
          <input type="password" id="password" class="input" required minlength="8" autocomplete="new-password" placeholder="Nhập mật khẩu mới">
          <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Hiện mật khẩu">Hiện</button>
        </div>
        <div class="password-strength" id="password-strength" aria-live="polite">
          <span class="strength-track"><span class="strength-fill"></span></span>
          <span class="strength-label">Dùng chữ hoa, chữ thường và số</span>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Xác nhận mật khẩu mới</label>
        <div class="password-field">
          <input type="password" id="confirm_password" class="input" required autocomplete="new-password" placeholder="Nhập lại mật khẩu mới">
          <button type="button" class="password-toggle" data-password-toggle="confirm_password" aria-label="Hiện mật khẩu xác nhận">Hiện</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block auth-submit" id="submit-btn">Cập nhật mật khẩu</button>
    </form>

    <div id="reset-complete" class="auth-complete" hidden>
      <a href="/login.html" class="btn btn-primary btn-block">Đăng nhập bằng mật khẩu mới</a>
    </div>
  </section>
</main>

<script src="/js/env.js"></script>
<script src="/js/api.js?v=20260720-2"></script>
<script src="/js/navigation.js?v=20260720-3"></script>
<script src="/js/auth.js?v=20260720-5"></script>
</body>
</html>
