global:
  resolve_timeout: 2m

route:
  receiver: joblink-webhook-sink
  group_by: ['alertname', 'service']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: joblink-webhook-sink
    webhook_configs:
      - url: 'http://web:3000/internal/alert-webhook'
        send_resolved: true
        max_alerts: 20
