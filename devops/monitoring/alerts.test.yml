rule_files:
  - alerts.yml
evaluation_interval: 10s
tests:
  - name: AI down waits 30 seconds and resolves after recovery
    interval: 10s
    input_series:
      - series: 'probe_success{job="joblink-probes",service="ai",instance="http://ai:5000/health"}'
        values: '1 0 0 0 0 1 1'
    alert_rule_test:
      - eval_time: 20s
        alertname: JobLinkServiceDown
        exp_alerts: []
      - eval_time: 40s
        alertname: JobLinkServiceDown
        exp_alerts:
          - exp_labels:
              job: joblink-probes
              service: ai
              instance: http://ai:5000/health
              severity: critical
            exp_annotations:
              summary: JobLink ai is unavailable
              description: http://ai:5000/health has failed probes for at least 30 seconds.
      - eval_time: 60s
        alertname: JobLinkServiceDown
        exp_alerts: []

  - name: High Node.js RSS memory triggers warning after 2 minutes and resolves
    interval: 30s
    input_series:
      - series: 'nodejs_resident_memory_bytes{job="joblink-web-metrics",service="web",instance="web:3000"}'
        values: '104857600 500000000 500000000 500000000 500000000 500000000 120000000'
    alert_rule_test:
      - eval_time: 1m
        alertname: JobLinkHighMemoryUsage
        exp_alerts: []
      - eval_time: 2m30s
        alertname: JobLinkHighMemoryUsage
        exp_alerts:
          - exp_labels:
              job: joblink-web-metrics
              service: web
              instance: web:3000
              severity: warning
            exp_annotations:
              summary: JobLink Web RSS memory exceeds 400 MiB
              description: Node.js container resident memory stayed above 400 MiB for 2 minutes.
      - eval_time: 3m
        alertname: JobLinkHighMemoryUsage
        exp_alerts: []
