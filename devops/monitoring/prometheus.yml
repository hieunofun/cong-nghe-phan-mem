global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: blackbox
    static_configs:
      - targets: ['blackbox:9115']
  - job_name: joblink-probes
    metrics_path: /probe
    static_configs:
      - targets: ['http://web:3000/health']
        labels: { service: web, module: http_health }
      - targets: ['http://ai:5000/health']
        labels: { service: ai, module: http_health }
      - targets: ['http://web:3000/api/jobs?limit=1']
        labels: { service: database-api, module: http_jobs }
      - targets: ['mysql:3306']
        labels: { service: mysql, module: tcp_connect }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
