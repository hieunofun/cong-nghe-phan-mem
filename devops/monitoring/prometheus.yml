global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: blackbox
    static_configs:
      - targets: ['blackbox:9115']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  # Giám sát tài nguyên máy chủ Host (CPU, RAM, Disk, Network) qua Node Exporter
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels: { service: host }

  # Giám sát tài nguyên từng Docker Container (CPU, RAM Working Set, I/O) qua cAdvisor
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels: { service: docker-containers }

  # White-box metrics nội tại của ứng dụng Web (Node.js Express)
  - job_name: joblink-web-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ['web:3000']
        labels: { service: web }

  # White-box metrics nội tại của dịch vụ AI (Python Gunicorn/Flask)
  - job_name: joblink-ai-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ['ai:5000']
        labels: { service: ai }

  # Blackbox probes kiểm tra tính sẵn sàng từ góc nhìn bên ngoài
  - job_name: joblink-probes
    metrics_path: /probe
    static_configs:
      - targets: ['http://gateway:80/gateway-health']
        labels: { service: gateway, module: http_health }
      - targets: ['http://web:3000/health']
        labels: { service: web, module: http_health }
      - targets: ['http://ai:5000/health']
        labels: { service: ai, module: http_health }
      - targets: ['http://web:3000/api/jobs?limit=1']
        labels: { service: database-api, module: http_jobs }
      - targets: ['mysql:3306']
        labels: { service: mysql, module: tcp_connect }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
