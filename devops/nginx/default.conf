# Reverse Proxy Gateway cho JobLink (Nginx 1.27 Alpine)
# - Định tuyến thống nhất vào Web/API
# - Nén Gzip, giới hạn kích thước upload CV (5MB)
# - Rate limit chống brute-force đăng nhập / quên mật khẩu
# - Chặn truy cập từ bên ngoài vào các đường dẫn nội bộ (/metrics, /internal/)

limit_req_zone $binary_remote_addr zone=joblink_auth_limit:10m rate=10r/s;

upstream joblink_web_upstream {
    server web:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 5m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Proxy-Gateway "joblink-nginx" always;

    # Endpoint kiểm tra sức khỏe riêng của tầng Reverse Proxy
    location = /gateway-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"joblink-gateway"}';
    }

    # Chặn hoàn toàn việc scrape metrics hoặc giả mạo webhook nội bộ qua cổng public
    location = /metrics {
        return 403 '{"message":"Forbidden: internal metrics endpoint"}';
    }

    location ^~ /internal/ {
        return 403 '{"message":"Forbidden: internal operational endpoint"}';
    }

    # Bảo vệ các API nhạy cảm bằng rate limiting
    location ~ ^/api/auth/(login|forgot-password)$ {
        limit_req zone=joblink_auth_limit burst=20 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://joblink_web_upstream;
    }

    # Toàn bộ giao diện tĩnh, uploads và API nghiệp vụ
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://joblink_web_upstream;
    }
}
